<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Bookkeeping | Professional Accounting Services</title>
  <meta name="description" content="Remote bookkeeping for US small businesses and real estate clients. QuickBooks Online, Xero, Zoho Books, Wave. Reconciliations, catch-up bookkeeping, clean-up and 1099 support.">
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --navy: #0f2b46;
      --blue: #1565c0;
      --teal: #0f9d8a;
      --whatsapp: #25d366;
      --ink: #1f2937;
      --muted: #5b6674;
      --line: #e3e9f0;
      --soft: #f5f9fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1140px, 92%); margin: 0 auto; }

    /* ---------- Header ---------- */
    header {
      position: sticky; top: 0; z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; padding: 6px 0;
    }
    /* Crop the logo so the text inside it is large and readable.
       The logo file has a lot of empty space around it, so the frame shows only the mark + text. */
    .brand {
      position: relative; width: 330px; height: 132px; overflow: hidden;
    }
    .brand img {
      position: absolute; left: -56px; top: -56px;
      width: 420px; max-width: none;
      mix-blend-mode: multiply; /* blends the off-white logo background into the white header */
    }
    .nav ul { display: flex; gap: 26px; list-style: none; }
    .nav ul a { font-weight: 600; color: var(--navy); font-size: 15px; }
    .nav ul a:hover { color: var(--blue); }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 24px; border-radius: 8px;
      font-weight: 600; font-size: 16px;
      transition: background .2s, color .2s, transform .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--navy); }
    .btn-whatsapp { background: var(--whatsapp); color: #fff; }
    .btn-whatsapp:hover { background: #1ebe5a; }
    .btn-ghost { border: 2px solid var(--blue); color: var(--blue); }
    .btn-ghost:hover { background: var(--blue); color: #fff; }

    /* ---------- Hero ---------- */
    .hero {
      background: linear-gradient(135deg, #eaf4fc 0%, #fff 65%);
      padding: 70px 0 80px;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(32px, 4.6vw, 52px); line-height: 1.15;
      color: var(--navy); max-width: 820px; margin: 0 auto 18px;
    }
    .hero p {
      font-size: 18px; color: var(--muted);
      max-width: 680px; margin: 0 auto 32px;
    }
    .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .platforms { margin-top: 48px; }
    .platforms p { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .platforms span {
      display: inline-block; margin: 4px 6px; padding: 6px 16px;
      border: 1px solid var(--line); border-radius: 999px; background: #fff;
      color: var(--navy); font-weight: 600; font-size: 14px;
    }

    /* ---------- Sections ---------- */
    section { padding: 88px 0; }
    .alt { background: var(--soft); }
    .section-head { text-align: center; max-width: 680px; margin: 0 auto 52px; }
    .section-head h2 {
      font-size: clamp(28px, 3.6vw, 38px); color: var(--navy); margin-bottom: 12px;
    }
    .section-head p { color: var(--muted); font-size: 17px; }

    /* ---------- Service cards (unchanged) ---------- */
    .grid {
      display: grid; gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .card {
      background: #fff; border: 1px solid var(--line);
      border-top: 4px solid var(--blue); border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 6px 18px rgba(11, 46, 79, .06);
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(11, 46, 79, .12); }
    .num {
      display: inline-grid; place-items: center;
      width: 40px; height: 40px; border-radius: 10px;
      background: #e8f2fc; color: var(--blue); font-weight: 700; margin-bottom: 18px;
    }
    .card h3 { color: var(--navy); font-size: 20px; margin-bottom: 10px; }
    .card p { color: var(--muted); font-size: 15.5px; }

    /* ---------- Online profiles ---------- */
    .profile-grid {
      display: grid; gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .profile {
      display: flex; flex-direction: column; align-items: flex-start;
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 28px; transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .profile:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(11, 46, 79, .10);
      border-color: var(--teal);
    }
    .logo-mark {
      display: flex; align-items: center; justify-content: center;
      height: 44px; margin-bottom: 16px;
    }
    .profile h3 { color: var(--navy); font-size: 18px; margin-bottom: 6px; }
    .profile p { color: var(--muted); font-size: 15px; margin-bottom: 18px; }
    .profile .link {
      margin-top: auto; color: var(--blue); font-weight: 600; font-size: 15px;
    }
    .profile:hover .link { color: var(--teal); }

    /* Brand mark styles */
    .mark-linkedin {
      width: 44px; height: 44px; border-radius: 8px; background: #0a66c2;
      color: #fff; font-weight: 800; font-size: 24px;
      display: grid; place-items: center; font-family: Arial, sans-serif;
    }
    .mark-fiverr {
      font-family: Arial, sans-serif; font-weight: 800; font-size: 30px;
      color: #404145; letter-spacing: -.5px;
    }
    .mark-fiverr span { color: #1dbf73; }
    .mark-freelancer {
      width: 44px; height: 44px; border-radius: 50%; background: #29b2fe;
      color: #fff; font-weight: 800; font-size: 26px;
      display: grid; place-items: center; font-family: Arial, sans-serif;
    }

    /* ---------- Rating ---------- */
    .rating-box {
      max-width: 560px; margin: 0 auto; background: #fff;
      border: 1px solid var(--line); border-radius: 12px;
      padding: 32px 28px; text-align: center;
      box-shadow: 0 6px 18px rgba(11, 46, 79, .06);
    }
    .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; }
    .stars button {
      background: none; border: 0; cursor: pointer;
      font-size: 40px; line-height: 1; color: #cfd8e3;
      transition: transform .15s, color .15s;
    }
    .stars button:hover { transform: scale(1.12); }
    .stars button.active { color: #f5b301; }
    .rating-box input, .rating-box textarea {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      border: 1px solid var(--line); border-radius: 8px;
      font: inherit; color: var(--ink);
    }
    .rating-box textarea { min-height: 100px; resize: vertical; }
